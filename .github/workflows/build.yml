name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Unzips, logs the target path, and flattens nested folder items safely
      - name: Extract Project Files
        run: |
          echo "==== Current Directory Structure Before Extraction ===="
          ls -la
          mkdir -p temp_build
          unzip -q Management-system.zip -d temp_build
          
          echo "==== Extracted Directory Structure ===="
          ls -la temp_build
          
          # Move files depending on how the folder nested during zip compression
          if [ -d "temp_build/Management-system" ]; then
            mv temp_build/Management-system/* . 2>/dev/null || true
            mv temp_build/Management-system/.* . 2>/dev/null || true
          else
            mv temp_build/* . 2>/dev/null || true
            mv temp_build/.* . 2>/dev/null || true
          fi
          rm -rf temp_build Management-system.zip
          
          echo "==== Final Root Directory Structure ===="
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true
          
      - name: Build Flutter Package Assets
        run: |
          flutter pub get
          
      - name: Compile Release Application
        run: |
          flutter build apk --release --no-pub
          
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
