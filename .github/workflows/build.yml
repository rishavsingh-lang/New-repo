name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Unzips your file and makes sure everything sits in the root folder
      - name: Unzip project files safely
        run: |
          unzip Management-system.zip -d extracted_temp
          if [ -d "extracted_temp/Management-system" ]; then
            mv extracted_temp/Management-system/* .
            mv extracted_temp/Management-system/.* . 2>/dev/null || true
          else
            mv extracted_temp/* .
            mv extracted_temp/.* . 2>/dev/null || true
          fi
          rm -rf extracted_temp Management-system.zip

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
